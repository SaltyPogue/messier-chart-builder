<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download Counters</title>
<style>body { margin:0; padding:40px 16px; background:#05060c; }</style>
</head>
<body>
<!-- Preview page. Copy everything between the two "SALTYPOGUE COUNTERS" lines into the home page,
     in place of the existing counter boxes. -->

<!-- ===== SALTYPOGUE COUNTERS: START ===== -->
<section class="sp-counters" aria-label="Download counters">
  <style>
    .sp-counters { max-width: 1100px; margin: 0 auto; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .sp-counters .sp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
    .sp-counters .sp-box { background: #0e1120; border: 1px solid #23283d; border-radius: 14px; padding: 18px 14px; text-align: center; }
    .sp-counters .sp-num { display: block; font-size: 34px; font-weight: 700; line-height: 1.1; color: #fff;
                           font-variant-numeric: tabular-nums; }
    .sp-counters .sp-label { display: block; margin-top: 6px; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: #9aa3b8; }
    .sp-counters .sp-box[data-accent] { border-top: 3px solid var(--accent); }
  </style>
  <div class="sp-grid">
    <!-- Keep your existing "Photos Framed" box here if you have one; it isn't a GitHub download. -->
    <div class="sp-box" data-accent style="--accent:#5aa8ff"><span class="sp-num" data-slug="messier-chart-builder">–</span><span class="sp-label">Messier Downloads</span></div>
    <div class="sp-box" data-accent style="--accent:#ff9a4d"><span class="sp-num" data-slug="caldwell-chart-builder">–</span><span class="sp-label">Caldwell Downloads</span></div>
    <div class="sp-box" data-accent style="--accent:#ff5a73"><span class="sp-num" data-slug="sharpless-chart-builder">–</span><span class="sp-label">Sharpless Downloads</span></div>
    <div class="sp-box" data-accent style="--accent:#f2b544"><span class="sp-num" data-slug="herschel-chart-builder">–</span><span class="sp-label">Herschel Downloads</span></div>
    <div class="sp-box" data-accent style="--accent:#e8894a"><span class="sp-num" data-slug="barnard-chart-builder">–</span><span class="sp-label">Barnard Downloads</span></div>
    <div class="sp-box" data-accent style="--accent:#4fd8be"><span class="sp-num" data-slug="abell-chart-builder">–</span><span class="sp-label">Abell Downloads</span></div>
    <div class="sp-box" data-accent style="--accent:#7fb2ff"><span class="sp-num" data-slug="vdb-chart-builder">–</span><span class="sp-label">van den Bergh Downloads</span></div>
  </div>
  <script>
  (function () {
    // Adds up the Windows + Mac download counts for each app from the GitHub releases.
    var URL = "https://api.github.com/repos/SaltyPogue/messier-chart-builder/releases?per_page=100";
    var KEY = "sp-counters-v1";
    function show(totals) {
      document.querySelectorAll(".sp-counters [data-slug]").forEach(function (el) {
        var n = totals[el.getAttribute("data-slug")];
        el.textContent = typeof n === "number" ? n.toLocaleString() : "–";
      });
    }
    function tally(releases) {
      var totals = {};
      releases.forEach(function (r) {
        (r.assets || []).forEach(function (a) {
          var slug = a.name.replace(/\.exe$/i, "").replace(/-mac-.*$/i, "").toLowerCase();
          totals[slug] = (totals[slug] || 0) + (a.download_count || 0);
        });
      });
      return totals;
    }
    try {   // reuse a recent result so repeat visits don't hit GitHub's rate limit
      var cached = JSON.parse(sessionStorage.getItem(KEY) || "null");
      if (cached && Date.now() - cached.t < 10 * 60 * 1000) { show(cached.totals); return; }
    } catch (e) {}
    fetch(URL, { headers: { "Accept": "application/vnd.github+json" } })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (releases) {
        var totals = tally(releases);
        show(totals);
        try { sessionStorage.setItem(KEY, JSON.stringify({ t: Date.now(), totals: totals })); } catch (e) {}
      })
      .catch(function () { /* leave the dashes if GitHub can't be reached */ });
  })();
  </script>
</section>
<!-- ===== SALTYPOGUE COUNTERS: END ===== -->

</body>
</html>
