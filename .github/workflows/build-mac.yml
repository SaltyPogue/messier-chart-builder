name: Build Mac apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.app }} (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        app: [Messier, Caldwell, Sharpless]
        runner: [macos-14, macos-15-intel]
        include:
          - runner: macos-14
            label: Apple Silicon
            arch: AppleSilicon
          - runner: macos-15-intel
            label: Intel
            arch: Intel
          - app: Messier
            script: messier_chart.py
            icon: messier_icon.icns
            bundle: com.saltypogue.messierchartbuilder
          - app: Caldwell
            script: caldwell_chart.py
            icon: caldwell_icon.icns
            bundle: com.saltypogue.caldwellchartbuilder
          - app: Sharpless
            script: sharpless_chart.py
            icon: sharpless_icon.icns
            bundle: com.saltypogue.sharplesschartbuilder
    runs-on: ${{ matrix.runner }}
    env:
      APP_NAME: ${{ matrix.app }} Chart Builder
      ZIP_NAME: ${{ matrix.app }}-Chart-Builder-Mac-${{ matrix.arch }}.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Tk is available
        run: python -c "import tkinter; r = tkinter.Tcl(); print('Tk OK', tkinter.TkVersion)"

      - name: Install build tools
        run: python -m pip install --upgrade pip pillow tkinterdnd2 pyinstaller

      - name: Build the .app
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name "$APP_NAME" \
            --icon "${{ matrix.icon }}" \
            --osx-bundle-identifier "${{ matrix.bundle }}" \
            --add-data "saltypogue_logo.png:." \
            --collect-all tkinterdnd2 \
            "${{ matrix.script }}"

      - name: Smoke test (app starts and stays running)
        run: |
          "dist/$APP_NAME.app/Contents/MacOS/$APP_NAME" > app.log 2>&1 &
          PID=$!
          sleep 25
          screencapture -x "screenshot-${{ matrix.app }}-${{ matrix.arch }}.png" || true
          if kill -0 $PID 2>/dev/null; then
            echo "App is running"; kill $PID
          else
            echo "App exited early:"; cat app.log; exit 1
          fi

      - name: Zip the app
        run: ditto -c -k --sequesterRsrc --keepParent "dist/$APP_NAME.app" "$ZIP_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.app }}-${{ matrix.arch }}
          path: ${{ env.ZIP_NAME }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-${{ matrix.app }}-${{ matrix.arch }}
          path: screenshot-${{ matrix.app }}-${{ matrix.arch }}.png
          if-no-files-found: ignore

  release:
    name: Publish downloads
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: screenshot-*
          path: shots
          merge-multiple: true

      - name: Save test screenshots to the "build-screenshots" branch
        continue-on-error: true
        run: |
          [ -n "$(ls shots/*.png 2>/dev/null)" ] || exit 0
          cd shots
          git init -q -b build-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Screenshots from build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-screenshots

      - name: Check there is something to publish
        run: ls -la *.zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-v${{ github.run_number }}
          name: SaltyPogue Chart Builders for Mac (build ${{ github.run_number }})
          make_latest: true
          files: "*.zip"
          body: |
            **Messier, Caldwell and Sharpless Chart Builders** for Mac, created by SaltyPogue.

            **Which file?** Pick the app you want, then the version for your Mac:
            - Mac with an Apple chip (M1, M2, M3, M4…, most Macs from late 2020 on): the file ending in **AppleSilicon.zip**
            - Older Mac with an Intel processor: the file ending in **Intel.zip**

            Not sure? Apple menu  → About This Mac → look at "Chip" or "Processor".

            | App | Catalog | Apple chip | Intel |
            |---|---|---|---|
            | Messier Chart Builder | 110 Messier objects | Messier-Chart-Builder-Mac-AppleSilicon.zip | Messier-Chart-Builder-Mac-Intel.zip |
            | Caldwell Chart Builder | 109 Caldwell objects | Caldwell-Chart-Builder-Mac-AppleSilicon.zip | Caldwell-Chart-Builder-Mac-Intel.zip |
            | Sharpless Chart Builder | 313 Sharpless nebulae | Sharpless-Chart-Builder-Mac-AppleSilicon.zip | Sharpless-Chart-Builder-Mac-Intel.zip |

            **Opening an app the first time:** double-click the zip, drag the app into Applications, then open it.
            macOS will say it "cannot verify" the app because it isn't from the App Store. Click **Done**, open
            **System Settings → Privacy & Security**, scroll down and click **Open Anyway** next to the app's name.
            You only need to do this once per app.

            Follow SaltyPogue: [Instagram](https://www.instagram.com/saltypogue) · [Facebook](https://www.facebook.com/saltypogue) · [X](https://x.com/saltypogue)
